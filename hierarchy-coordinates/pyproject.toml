[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hierarchy-coordinates"
version = "0.1.0"
description = "Hierarchy coordinates (treeness, feedforwardness, orderability) of weighted directed graphs"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Max Bromberg" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "networkx>=2.8"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["hierarchy_coordinates"]
