[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nichenet"
version = "0.1.0"
description = "Source-to-structure networks, optimal learning in noisy niches, and adaptive transport networks"
authors = [{ name = "Max Bromberg" }]
requires-python = ">=3.10"
# Core stays pure numpy/scipy/networkx so the same wheel runs in Pyodide; jax and numba are optional accelerators.
dependencies = ["numpy>=1.23", "scipy>=1.10", "networkx>=2.8"]

[project.optional-dependencies]
fast = ["jax>=0.4.30", "numba>=0.60"]
# hierarchy-coordinates is its own package (hierarchy-coordinates/ until it moves to its own repository)
experiments = ["hierarchy-coordinates", "pandas>=2.2", "pyarrow>=16", "pydantic>=2.7", "pyyaml", "joblib"]
dev = ["pytest", "pytest-xdist", "hypothesis", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running statistical tests"]
addopts = "-p no:cacheprovider -m \"not slow\""

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Greek letters in docstrings and comments are intended

[tool.ruff.lint.isort]
known-first-party = ["nichenet"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["E402"]
