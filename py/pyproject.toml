[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nichenet"
version = "0.1.0"
description = "Source-to-structure networks, optimal learning in noisy niches, and adaptive transport networks"
authors = [{ name = "Max Bromberg" }]
requires-python = ">=3.10"
# Core stays pure numpy/scipy/networkx; jax and numba are optional accelerators.
dependencies = ["numpy>=1.23", "scipy>=1.10", "networkx>=2.8"]

[project.optional-dependencies]
fast = ["jax>=0.4.30", "numba>=0.60"]
# Hierarchy coordinates are their own package (github.com/Maqz-Bromberg/hierarchy-coordinates), pinned to 0.1.0,
# the last version with the thesis variant (experiments v_ss and errata_hierarchy, test_hierarchy_thesis.py)
experiments = [
    "hierarchy-coordinates @ git+https://github.com/Maqz-Bromberg/hierarchy-coordinates@554aee9fa4e01e61e613d11d11e775749134dc28",
    "pandas>=2.2", "pyarrow>=16", "pydantic>=2.7", "pyyaml", "joblib",
]
dev = ["pytest", "pytest-xdist", "hypothesis", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running statistical tests"]
addopts = "-p no:cacheprovider -m \"not slow\""

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Greek letters in docstrings and comments are intended

[tool.ruff.lint.isort]
known-first-party = ["nichenet"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["E402"]
