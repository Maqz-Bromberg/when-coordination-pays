# Environment for running Lee, Flack & Krakauer's reference code (reference/adaptation, commit f38e8c9) as a
# test oracle. Versions follow the paper's pyutils/adaptation.yml.
name: lee-ref
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=1.26.4
  - scipy=1.12
  - numba=0.59
  - multiprocess=0.70.16
  - threadpoolctl=3.3
